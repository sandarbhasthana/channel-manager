// Pricing service — owns rate plans and per-(date,room_type,rate_plan)
// rate points. Tenancy is implicit via auth context.
syntax = "proto3";

package pricing.v1;

import "common/v1/types.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/channel-manager/channel-manager/gen/go/pricing/v1;pricingv1";

// RatePlan is a sellable rate definition (e.g. "BAR", "Non-Refundable").
message RatePlan {
  string id = 1;
  string property_id = 2;
  string code = 3;
  string name = 4;
  // Currency for all rate points under this plan.
  string currency = 5;
  bool active = 6;
  google.protobuf.Timestamp created_at = 7;
  google.protobuf.Timestamp updated_at = 8;
}

// RatePoint is the price for one room_type/rate_plan/date.
message RatePoint {
  string property_id = 1;
  string room_type_id = 2;
  string rate_plan_id = 3;
  common.v1.CalendarDate date = 4;
  common.v1.Money amount = 5;
  google.protobuf.Timestamp updated_at = 6;
}

// PromoCode is a discount code owned by the organization. property_id empty
// means it applies org-wide. max_uses 0 means unlimited.
message PromoCode {
  string id = 1;
  string property_id = 2;
  string code = 3;
  string description = 4;
  double discount_pct = 5;
  int32 max_uses = 6;
  int32 uses = 7;
  google.protobuf.Timestamp valid_from = 8;
  google.protobuf.Timestamp valid_until = 9;
  bool is_active = 10;
  google.protobuf.Timestamp created_at = 11;
  google.protobuf.Timestamp updated_at = 12;
}

service PricingService {
  rpc ListRatePlans(ListRatePlansRequest) returns (ListRatePlansResponse);
  rpc GetRates(GetRatesRequest) returns (GetRatesResponse);
  rpc BulkUpsertRates(BulkUpsertRatesRequest) returns (BulkUpsertRatesResponse);

  // Promo code management (coupons). Channel Manager owns promo definitions and
  // the redemption counter for every tenant.
  rpc ListPromoCodes(ListPromoCodesRequest) returns (ListPromoCodesResponse);
  rpc CreatePromoCode(CreatePromoCodeRequest) returns (CreatePromoCodeResponse);
  rpc UpdatePromoCode(UpdatePromoCodeRequest) returns (UpdatePromoCodeResponse);
  rpc DeletePromoCode(DeletePromoCodeRequest) returns (DeletePromoCodeResponse);
}

message ListPromoCodesRequest {}
message ListPromoCodesResponse {
  repeated PromoCode promo_codes = 1;
}
message CreatePromoCodeRequest {
  PromoCode promo_code = 1;
}
message CreatePromoCodeResponse {
  PromoCode promo_code = 1;
}
message UpdatePromoCodeRequest {
  PromoCode promo_code = 1;
}
message UpdatePromoCodeResponse {
  PromoCode promo_code = 1;
}
message DeletePromoCodeRequest {
  string id = 1;
}
message DeletePromoCodeResponse {}

message ListRatePlansRequest {
  string property_id = 1;
  common.v1.PageRequest page = 2;
}

message ListRatePlansResponse {
  repeated RatePlan plans = 1;
  common.v1.PageResponse page = 2;
}

message GetRatesRequest {
  string property_id = 1;
  string room_type_id = 2;
  string rate_plan_id = 3;
  common.v1.DateRange range = 4;
}

message GetRatesResponse {
  repeated RatePoint points = 1;
}

message BulkUpsertRatesRequest {
  repeated RatePoint points = 1;
  common.v1.IdempotencyKey idempotency_key = 2;
  common.v1.AuditMetadata audit = 3;
}

message BulkUpsertRatesResponse {
  int32 rows_affected = 1;
  string event_id = 2;
}
