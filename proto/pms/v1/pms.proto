// PMS service — registry of Property Management System connections and the
// canonical view of properties and room types learned from those PMSes.
syntax = "proto3";

package pms.v1;

import "common/v1/types.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/channel-manager/channel-manager/gen/go/pms/v1;pmsv1";

enum PmsKind {
  PMS_KIND_UNSPECIFIED = 0;
  PMS_KIND_CLOUDBEDS = 1;
  PMS_KIND_MEWS = 2;
  PMS_KIND_OPERA = 3;
  PMS_KIND_CUSTOM = 4;
  PMS_KIND_MYPMS = 5;
}

enum PmsStatus {
  PMS_STATUS_UNSPECIFIED = 0;
  PMS_STATUS_ACTIVE = 1;
  PMS_STATUS_PAUSED = 2;
  PMS_STATUS_DISCONNECTED = 3;
  PMS_STATUS_ERROR = 4;
}

// PmsConnection is one tenant's link to a PMS account.
message PmsConnection {
  string id = 1;
  PmsKind kind = 2;
  PmsStatus status = 3;
  // Display label for the connection (e.g. "Cloudbeds — Mountain Group").
  string label = 4;
  google.protobuf.Timestamp last_sync_at = 5;
  string last_error = 6;
  google.protobuf.Timestamp created_at = 7;
  google.protobuf.Timestamp updated_at = 8;
}

// Property is the canonical hotel/listing as known to Channel Manager.
message Property {
  string id = 1;
  string pms_id = 2;
  string external_property_id = 3;
  string name = 4;
  string timezone = 5;
  string default_currency = 6;
  google.protobuf.Timestamp created_at = 7;
  google.protobuf.Timestamp updated_at = 8;
}

// Room is a physical room within a RoomType.
message Room {
  string id = 1;
  string property_id = 2;
  string room_type_id = 3;
  string external_id = 4;
  string name = 5;
  bool is_active = 6;
  google.protobuf.Timestamp created_at = 7;
  google.protobuf.Timestamp updated_at = 8;
}

// RoomType is a sellable unit category within a property.
message RoomType {
  string id = 1;
  string property_id = 2;
  string code = 3;
  string name = 4;
  int32 max_occupancy = 5;
  int32 base_occupancy = 6;
  repeated Room rooms = 9;
  google.protobuf.Timestamp created_at = 7;
  google.protobuf.Timestamp updated_at = 8;
}

service PmsService {
  rpc ListConnections(ListConnectionsRequest) returns (ListConnectionsResponse);
  rpc ConnectPms(ConnectPmsRequest) returns (ConnectPmsResponse);
  rpc DisconnectPms(DisconnectPmsRequest) returns (DisconnectPmsResponse);

  rpc ListProperties(ListPropertiesRequest) returns (ListPropertiesResponse);
  rpc GetProperty(GetPropertyRequest) returns (GetPropertyResponse);
  rpc ListRoomTypes(ListRoomTypesRequest) returns (ListRoomTypesResponse);

  // Pull property + room-type catalog from the PMS webhook API (§1.2, §1.5).
  rpc SyncCatalog(SyncCatalogRequest) returns (SyncCatalogResponse);
  // Pull availability from the PMS and upsert inventory_days (§1.4).
  rpc IngestAvailability(IngestAvailabilityRequest) returns (IngestAvailabilityResponse);

  rpc OrgHealth(OrgHealthRequest) returns (OrgHealthResponse);
  rpc PropertyHealth(PropertyHealthRequest) returns (PropertyHealthResponse);
  rpc GetQuote(GetQuoteRequest) returns (GetQuoteResponse);
  rpc CreateBooking(CreateBookingRequest) returns (CreateBookingResponse);
  rpc GetBooking(GetBookingRequest) returns (GetBookingResponse);
  rpc UpdateBooking(UpdateBookingRequest) returns (UpdateBookingResponse);
  rpc CancelBooking(CancelBookingRequest) returns (CancelBookingResponse);
  rpc DeleteBooking(DeleteBookingRequest) returns (DeleteBookingResponse);
  rpc ListBookings(ListBookingsRequest) returns (ListBookingsResponse);
}

message ListConnectionsRequest {
  common.v1.PageRequest page = 1;
}

message ListConnectionsResponse {
  repeated PmsConnection connections = 1;
  common.v1.PageResponse page = 2;
}

message ConnectPmsRequest {
  PmsKind kind = 1;
  string label = 2;
  // Credentials are forwarded to Secrets Manager, never persisted in DB.
  map<string, string> credentials = 3;
  common.v1.IdempotencyKey idempotency_key = 4;
  common.v1.AuditMetadata audit = 5;
}

message ConnectPmsResponse {
  PmsConnection connection = 1;
  string event_id = 2;
}

message DisconnectPmsRequest {
  string id = 1;
  common.v1.AuditMetadata audit = 2;
}

message DisconnectPmsResponse {
  PmsConnection connection = 1;
}

message ListPropertiesRequest {
  string pms_id = 1;
  common.v1.PageRequest page = 2;
}

message ListPropertiesResponse {
  repeated Property properties = 1;
  common.v1.PageResponse page = 2;
}

message GetPropertyRequest {
  string id = 1;
}

message GetPropertyResponse {
  Property property = 1;
  repeated RoomType room_types = 2;
}

message ListRoomTypesRequest {
  string property_id = 1;
  common.v1.PageRequest page = 2;
}

message ListRoomTypesResponse {
  repeated RoomType room_types = 1;
  common.v1.PageResponse page = 2;
}

message SyncCatalogRequest {
  string connection_id = 1;
  string city = 2;
  string country = 3;
  string name = 4;
}

message SyncCatalogResponse {
  int32 properties_synced = 1;
  int32 room_types_synced = 2;
}

message IngestAvailabilityRequest {
  string property_id = 1;
  common.v1.CalendarDate checkin = 2;
  common.v1.CalendarDate checkout = 3;
  int32 adults = 4;
  int32 children = 5;
  int32 rooms = 6;
  string room_type_name = 7;
}

message IngestAvailabilityResponse {
  int32 inventory_rows_affected = 1;
  string event_id = 2;
}

message OrgHealthRequest {
  string connection_id = 1;
}

message OrgHealthResponse {
  string status = 1;
  string service = 2;
  string organization_id = 3;
  repeated string available_actions = 4;
}

message PropertyHealthRequest {
  string property_id = 1;
}

message PropertyHealthResponse {
  string status = 1;
  string service = 2;
  Property property = 3;
  repeated string available_actions = 4;
}

message GetQuoteRequest {
  string property_id = 1;
  string room_id = 2;
  common.v1.CalendarDate checkin = 3;
  common.v1.CalendarDate checkout = 4;
  int32 adults = 5;
}

message GetQuoteResponse {
  string room_id = 1;
  string room_name = 2;
  string room_type = 3;
  int32 nights = 4;
  int32 adults = 5;
  int32 capacity = 6;
  double price_per_night = 7;
  double total_price = 8;
  string currency = 9;
  bool is_available = 10;
}

message CreateBookingRequest {
  string property_id = 1;
  string room_id = 2;
  common.v1.CalendarDate checkin = 3;
  common.v1.CalendarDate checkout = 4;
  string guest_name = 5;
  string email = 6;
  string phone = 7;
  int32 adults = 8;
  int32 children = 9;
  string notes = 10;
}

message PmsBooking {
  string booking_id = 1;
  string status = 2;
  string guest_name = 3;
  string email = 4;
  string phone = 5;
  string room_id = 6;
  string room_name = 7;
  string room_type = 8;
  string property_name = 9;
  string checkin = 10;
  string checkout = 11;
  int32 adults = 12;
  int32 children = 13;
  string notes = 14;
  string payment_status = 15;
  string source = 16;
  string message = 17;
}

message CreateBookingResponse {
  PmsBooking booking = 1;
}

message GetBookingRequest {
  string property_id = 1;
  string booking_id = 2;
}

message GetBookingResponse {
  PmsBooking booking = 1;
}

message UpdateBookingRequest {
  string property_id = 1;
  string booking_id = 2;
  common.v1.CalendarDate checkin = 3;
  common.v1.CalendarDate checkout = 4;
  string guest_name = 5;
  string email = 6;
  string phone = 7;
  optional int32 adults = 8;
  optional int32 children = 9;
  string notes = 10;
  string room_id = 11;
}

message UpdateBookingResponse {
  PmsBooking booking = 1;
}

message CancelBookingRequest {
  string property_id = 1;
  string booking_id = 2;
  string reason = 3;
}

message CancelBookingResponse {
  string booking_id = 1;
  string status = 2;
  string message = 3;
}

message DeleteBookingRequest {
  string property_id = 1;
  string booking_id = 2;
}

message DeleteBookingResponse {
  string booking_id = 1;
  string status = 2;
}

message ListBookingsRequest {
  string property_id = 1;
  string status = 2;
  common.v1.CalendarDate start_date = 3;
  common.v1.CalendarDate end_date = 4;
}

message ListBookingsResponse {
  repeated PmsBooking bookings = 1;
  int32 count = 2;
}
