version: "2"
sql:
  - engine: "postgresql"
    schema: "adapters/postgres/schema.sql"
    queries: "adapters/postgres/queries/"
    gen:
      go:
        package: "pgstore"
        out: "adapters/postgres/pgstore"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_empty_slices: true
        emit_pointers_for_null_types: true
        overrides:
          - db_type: "uuid"
            go_type: "github.com/google/uuid.UUID"
          - db_type: "timestamptz"
            go_type: "time.Time"
