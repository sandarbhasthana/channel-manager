# Channel Manager RBAC model.
#
# Request/policy tuple: (subject, domain, object, action)
#   subject — WorkOS user id (sub claim)
#   domain  — tenancy.organizations.id (tenant boundary; matches RLS app.current_org_id)
#   object  — resource path or identifier (e.g. "properties/*", "rates/*")
#   action  — verb (read | write | admin)
#
# `g` is a domain-scoped grouping relation: g(user, role, domain) lets us
# attach a role to a user inside a single org without leaking to others.
# Roles themselves are subjects of `p` rules, so a single rule grants the
# role its permissions on a resource pattern.

[request_definition]
r = sub, dom, obj, act

[policy_definition]
p = sub, dom, obj, act

[role_definition]
g = _, _, _

[policy_effect]
e = some(where (p.eft == allow))

[matchers]
m = g(r.sub, p.sub, r.dom) && r.dom == p.dom && keyMatch(r.obj, p.obj) && r.act == p.act
